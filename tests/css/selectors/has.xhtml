<tests>

<test name="select-has">
    <container>
        <html xmlns="http://www.w3.org/1999/xhtml">

        <head>
            <style>
                body {
                    margin: 0;
                }

                div, p, span, em, a, section, article {
                    display: block;
                    width: 100px;
                    margin: 0;
                    padding: 0;
                }

                div, p, span, em, a {
                    height: 20px;
                }
            </style>
        </head>

        <body>
            <slot />
        </body>

        </html>
    </container>

    <rendering help="reference">
        <div style="background-color: green;" />
        <div style="background-color: green;" />
        <div style="background-color: green;" />
        <div style="background-color: green;" />
    </rendering>

    <rendering help="relative selectors with every combinator">
        <style>
            .child:has(> .x),
            .descendant:has(.y),
            .next:has(+ .target),
            .descendant:has(~ .target) .y,
            .target:not(:has(*)) {
                background-color: green;
            }

            .target:has(+ .next),
            .descendant:has(> .y) .y,
            .child:has(.y) .x {
                background-color: red !important;
            }
        </style>
        <section class="child">
            <div class="x" />
        </section>
        <section class="descendant">
            <article>
                <div class="y" />
            </article>
        </section>
        <div class="next" />
        <div class="target" />
    </rendering>

    <rendering help="complex relative selectors">
        <style>
            .a:has(> article > .b + .c) .b,
            .a:has(.b ~ .c) .c,
            .a:has(~ .d) + .d,
            .d:has(+ .e) + .e {
                background-color: green;
            }

            .a:has(> .b) .b,
            .a:has(.c + .b) .c {
                background-color: red !important;
            }
        </style>
        <section class="a">
            <article>
                <div class="b" />
                <div class="c" />
            </article>
        </section>
        <div class="d" />
        <div class="e" />
    </rendering>

    <error help="no element matches the relative selector">
        <style>
            div:has(.a) {
                background-color: green;
            }
        </style>
        <div class="a" />
        <div class="a" />
        <div class="a" />
        <div class="a" />
    </error>
</test>

</tests>
