<tests>

<test name="select-id">
    <container>
        <html xmlns="http://www.w3.org/1999/xhtml">

        <head>
            <style>
                body {
                    margin: 0;
                }

                div, p, span, em, a, section, article {
                    display: block;
                    width: 100px;
                    margin: 0;
                    padding: 0;
                }

                div, p, span, em, a {
                    height: 20px;
                }
            </style>
        </head>

        <body>
            <slot />
        </body>

        </html>
    </container>

    <rendering help="reference">
        <div style="background-color: green;" />
        <div style="background-color: green;" />
    </rendering>

    <rendering help="id selectors">
        <style>
            #a, #b {
                background-color: green;
            }

            #c {
                background-color: red !important;
            }
        </style>
        <div id="a" />
        <div id="b" />
    </rendering>

    <rendering help="id selector in compound">
        <style>
            div#a, p#b {
                background-color: green;
            }

            p#a, div#b {
                background-color: red !important;
            }
        </style>
        <div id="a" />
        <p id="b" />
    </rendering>

    <error help="id selectors are case-sensitive">
        <style>
            #A, #B {
                background-color: green;
            }
        </style>
        <div id="a" />
        <div id="b" />
    </error>

    <error help="id selector does not match a whitespace separated part">
        <style>
            #a {
                background-color: green;
            }
        </style>
        <div id="a b" />
        <div id="a b" />
    </error>
</test>

</tests>
