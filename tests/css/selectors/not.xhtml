<tests>

<test name="select-not">
    <container>
        <html xmlns="http://www.w3.org/1999/xhtml">

        <head>
            <style>
                body {
                    margin: 0;
                }

                div, p, span, em, a, section, article {
                    display: block;
                    width: 100px;
                    margin: 0;
                    padding: 0;
                }

                div, p, span, em, a {
                    height: 20px;
                }
            </style>
        </head>

        <body>
            <slot />
        </body>

        </html>
    </container>

    <rendering help="reference">
        <div style="background-color: green;" />
        <div style="background-color: green;" />
        <div style="background-color: green;" />
    </rendering>

    <rendering help="matches elements that match none of its arguments">
        <style>
            div:not(.b) {
                background-color: green;
            }

            .b:not(.a, .c) {
                background-color: green;
            }

            div:not(div),
            .a:not(.z):not(.a),
            div:not(.a, .b, .c) {
                background-color: red !important;
            }
        </style>
        <div class="a" />
        <div class="b" />
        <div class="c" />
    </rendering>

    <rendering help="has the specificity of its most specific argument">
        <style>
            div:not(#nope, .b) {
                background-color: green;
            }

            div.a.a {
                background-color: red;
            }
        </style>
        <div class="a" />
        <div class="a" />
        <div class="a" />
    </rendering>

    <error help="every element matches the argument">
        <style>
            div:not(.a) {
                background-color: green;
            }
        </style>
        <div class="a" />
        <div class="a" />
        <div class="a" />
    </error>
</test>

</tests>
