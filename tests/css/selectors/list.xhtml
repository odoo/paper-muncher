<tests>

<test name="select-list">
    <container>
        <html xmlns="http://www.w3.org/1999/xhtml">

        <head>
            <style>
                body {
                    margin: 0;
                }

                div, p, span, em, a, section, article {
                    display: block;
                    width: 100px;
                    margin: 0;
                    padding: 0;
                }

                div, p, span, em, a {
                    height: 20px;
                }
            </style>
        </head>

        <body>
            <slot />
        </body>

        </html>
    </container>

    <rendering help="reference">
        <div style="background-color: green;" />
        <div style="background-color: green;" />
        <div style="background-color: green;" />
    </rendering>

    <rendering help="selector list">
        <style>
            .a, .b,
            .c {
                background-color: green;
            }
        </style>
        <div class="a" />
        <div class="b" />
        <div class="c" />
    </rendering>

    <rendering help="an invalid selector invalidates the whole list">
        <style>
            div {
                background-color: green;
            }

            .a, .b:not-a-pseudo-class {
                background-color: red !important;
            }

            .c, .d > {
                background-color: red !important;
            }
        </style>
        <div class="a" />
        <div class="b" />
        <div class="c" />
    </rendering>

    <error help="selector list missing an element">
        <style>
            .a, .b {
                background-color: green;
            }
        </style>
        <div class="a" />
        <div class="b" />
        <div class="c" />
    </error>
</test>

</tests>
