<tests>

<test name="select-where">
    <container>
        <html xmlns="http://www.w3.org/1999/xhtml">

        <head>
            <style>
                body {
                    margin: 0;
                }

                div, p, span, em, a, section, article {
                    display: block;
                    width: 100px;
                    margin: 0;
                    padding: 0;
                }

                div, p, span, em, a {
                    height: 20px;
                }
            </style>
        </head>

        <body>
            <slot />
        </body>

        </html>
    </container>

    <rendering help="reference">
        <div style="background-color: green;" />
        <div style="background-color: green;" />
        <div style="background-color: green;" />
    </rendering>

    <rendering help="matches any selector of its list">
        <style>
            :where(.a, .b),
            :where(.c div) {
                background-color: green;
            }
        </style>
        <div class="a" />
        <div class="b" />
        <section class="c">
            <div />
        </section>
    </rendering>

    <rendering help="has a specificity of zero">
        <style>
            div {
                background-color: green;
            }

            :where(#a, #b, #c) {
                background-color: red;
            }
        </style>
        <div id="a" />
        <div id="b" />
        <div id="c" />
    </rendering>

    <error help="no argument matches">
        <style>
            :where(.x, .y) {
                background-color: green;
            }
        </style>
        <div class="a" />
        <div class="b" />
        <div class="c" />
    </error>
</test>

</tests>
