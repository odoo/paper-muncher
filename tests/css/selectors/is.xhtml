<tests>

<test name="select-is">
    <container>
        <html xmlns="http://www.w3.org/1999/xhtml">

        <head>
            <style>
                body {
                    margin: 0;
                }

                div, p, span, em, a, section, article {
                    display: block;
                    width: 100px;
                    margin: 0;
                    padding: 0;
                }

                div, p, span, em, a {
                    height: 20px;
                }
            </style>
        </head>

        <body>
            <slot />
        </body>

        </html>
    </container>

    <rendering help="reference">
        <div style="background-color: green;" />
        <div style="background-color: green;" />
        <div style="background-color: green;" />
    </rendering>

    <rendering help="matches any selector of its list">
        <style>
            :is(.a, .b),
            :is(.c div) {
                background-color: green;
            }

            :is(.z, section > .a) {
                background-color: red !important;
            }
        </style>
        <div class="a" />
        <div class="b" />
        <section class="c">
            <div />
        </section>
    </rendering>

    <rendering help="takes a forgiving selector list">
        <style>
            div:is(.a, :not-a-pseudo-class, .b, .c) {
                background-color: green;
            }
        </style>
        <div class="a" />
        <div class="b" />
        <div class="c" />
    </rendering>

    <rendering help="has the specificity of its most specific argument">
        <style>
            div:is(#nope, .a) {
                background-color: green;
            }

            div.a.a {
                background-color: red;
            }
        </style>
        <div class="a" />
        <div class="a" />
        <div class="a" />
    </rendering>

    <error help="no argument matches">
        <style>
            :is(.x, .y) {
                background-color: green;
            }
        </style>
        <div class="a" />
        <div class="b" />
        <div class="c" />
    </error>
</test>

</tests>
