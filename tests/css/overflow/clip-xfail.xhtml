<!-- overflow: hidden does not clip. -->
<tests>

<test name="overflow-hidden-clips">
    <container>
        <html lang="en" xmlns="http://www.w3.org/1999/xhtml">
        <head>
            <style>
                html, body { margin: 0; background: white; font-size: 0; }
                    .g { background-color: green; }
                .big { width: 200px; height: 200px; background-color: green; }
            </style>
        </head>
        <body>
            <slot/>
        </body>
        </html>
    </container>

    <rendering help="reference: 100x50 green box">
        <div class="g" style="width: 100px; height: 50px"/>
    </rendering>

    <rendering help="wkhtmltopdf parity (Odoo reports): overflow: hidden must clip the overflowing child (labels, body.overflow-hidden)" xfail="true">
        <div style="width: 100px; height: 50px; overflow: hidden"><div class="big"/></div>
    </rendering>

    <rendering help="wkhtmltopdf parity (Odoo reports): overflow: clip" xfail="true">
        <div style="width: 100px; height: 50px; overflow: clip"><div class="big"/></div>
    </rendering>

    <rendering help="wkhtmltopdf parity (Odoo reports): overflow-x / overflow-y: hidden" xfail="true">
        <div style="width: 100px; height: 50px; overflow-x: hidden; overflow-y: hidden"><div class="big"/></div>
    </rendering>
</test>

</tests>
