<tests>

<test name="calc">
    <container>
        <html lang="en" xmlns="http://www.w3.org/1999/xhtml">

        <head>
            <style>
                body {
                    margin: 0px;
                    --thevar: -200px;
                }

                .foo {
                    background-color: #b98af1;
                    height: 100px;
                }

                #ref {
                    width: 100px;
                    background: #61eaae;
                }

                .good {
                    width: 100px;
                }
            </style>
        </head>

        <body>
            <div id="ref" class="foo"></div>
            <slot />
        </body>

        </html>
    </container>

    <rendering>
        <div class="foo good"></div>
    </rendering>

    <rendering help="classic addition">
        <div class="foo" style="width: calc(50px + 50px)"></div>
    </rendering>

    <rendering help="classic subtraction">
        <div class="foo" style="width: calc(150px - 50px)"></div>
    </rendering>

    <rendering help="classic multiplication">
        <div class="foo" style="width: calc(2 * 50px)"></div>
    </rendering>

    <rendering help="classic multiplication 2">
        <div class="foo" style="width: calc(.5 * 200px)"></div>
    </rendering>

    <rendering help="classic division">
        <div class="foo" style="width: calc(200px / 2)"></div>
    </rendering>

    <rendering help="short multiplication">
        <div class="foo" style="width: calc(50px* 2)"></div>
    </rendering>

    <rendering help="short division">
        <div class="foo" style="width: calc(200px/ 2)"></div>
    </rendering>

    <rendering help="negative multiplication">
        <div class="foo" style="width: calc(-0.5* -200px)"></div>
    </rendering>

    <rendering help="negative multiplication 2">
        <div class="foo" style="width: calc(-.5* -200px)"></div>
    </rendering>

    <rendering help="negative multiplication with var">
        <div class="foo" style="width: calc(-.5* var(--thevar))"></div>
    </rendering>

    <rendering help="percentage and length">
        <div class="foo" style="width: calc(25% + 50px)"></div>
    </rendering>

    <rendering help="font relative and absolute length">
        <div class="foo" style="width: calc(4em + 36px)"></div>
    </rendering>

    <rendering help="root font relative and absolute length">
        <div class="foo" style="width: calc(5rem + 20px)"></div>
    </rendering>

    <rendering help="multiplication of a font relative length">
        <div class="foo" style="width: calc(1.25 * 5em)"></div>
    </rendering>

    <rendering help="division of a font relative length">
        <div class="foo" style="width: calc(12.5em / 2)"></div>
    </rendering>
</test>

<test name="calc-invalid">
    <container>
        <html lang="en" xmlns="http://www.w3.org/1999/xhtml">

        <head>
            <style>
                body {
                    margin: 0px;
                }

                div {
                    height: 100px;
                    background-color: green;
                }
            </style>
        </head>

        <body>
            <slot />
        </body>

        </html>
    </container>

    <rendering>
        <div></div>
    </rendering>

    <rendering help="multiplying two lengths is invalid, the declaration is ignored">
        <div style="width: calc(10px * 10px)"></div>
    </rendering>

    <rendering help="dividing by a length is invalid, the declaration is ignored">
        <div style="width: calc(100px / 2px)"></div>
    </rendering>

    <rendering help="adding a length and a number is invalid, the declaration is ignored">
        <div style="width: calc(10px + 2)"></div>
    </rendering>

    <rendering help="adding a length and an angle is invalid, the declaration is ignored">
        <div style="width: calc(10px + 5deg)"></div>
    </rendering>

    <error help="a valid calc() is applied">
        <div style="width: calc(10px * 10)"></div>
    </error>
</test>

</tests>
