<!-- SVG basic shapes: ellipse/polygon/polyline/line are not built. (circle and viewBox scaling only fail in the PDF backend, which these BMP reftests cannot cover) -->
<tests>

<test name="svg-polygon-polyline-line">
    <container>
        <html lang="en" xmlns="http://www.w3.org/1999/xhtml">
        <head>
            <style>
                html, body { margin: 0; background: white; font-size: 0; }
                    .g { background-color: green; }
                svg { display: block; }
            </style>
        </head>
        <body>
            <slot/>
        </body>
        </html>
    </container>

    <rendering help="reference: &lt;rect&gt;">
        <svg xmlns="http://www.w3.org/2000/svg" width="100" height="50"><rect width="100" height="50" fill="green"/></svg>
    </rendering>

    <rendering help="wkhtmltopdf parity (Odoo reports): &lt;polygon&gt; ('cannot build element into svg tree')" xfail="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="100" height="50"><polygon points="0,0 100,0 100,50 0,50" fill="green"/></svg>
    </rendering>

    <rendering help="wkhtmltopdf parity (Odoo reports): &lt;polyline&gt;" xfail="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="100" height="50"><polyline points="0,0 100,0 100,50 0,50" fill="green"/></svg>
    </rendering>

    <rendering help="wkhtmltopdf parity (Odoo reports): &lt;line&gt;" xfail="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="100" height="50"><line x1="0" y1="25" x2="100" y2="25" stroke="green" stroke-width="50"/></svg>
    </rendering>
</test>

<test name="svg-ellipse-is-painted">
    <container>
        <html lang="en" xmlns="http://www.w3.org/1999/xhtml">
        <head>
            <style>
                html, body { margin: 0; background: white; font-size: 0; }
                    .g { background-color: green; }
                svg { display: block; }
            </style>
        </head>
        <body>
            <slot/>
        </body>
        </html>
    </container>

    <rendering help="reference: empty 100x100 svg">
        <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"></svg>
    </rendering>

    <error help="wkhtmltopdf parity (Odoo reports): &lt;ellipse&gt; must paint something" xfail="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><ellipse cx="50" cy="50" rx="50" ry="25" fill="green"/></svg>
    </error>
</test>

</tests>
