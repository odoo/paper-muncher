<tests>

<!-- https://drafts.csswg.org/css-values-4/#keywords -->
<!-- https://drafts.csswg.org/css-conditional-3/#typedef-supports-condition -->
<test name="@supports condition: true">
    <container>
        <html xmlns="http://www.w3.org/1999/xhtml">
        <head>
            <style>
                div { width: 100px; height: 100px; background: green }
            </style>
        </head>
        <body>
        <slot/>
        </body>
        </html>
    </container>

    <rendering>
        <div/>
    </rendering>

    <rendering>
        <style>
            @supports not (color: green) {
                div { background: red; }
            }
        </style>
        <div/>
    </rendering>

    <rendering>
        <style>
            @supports NOT (color: green) {
                div { background: red; }
            }
        </style>
        <div/>
    </rendering>

    <rendering>
        <style>
            @supports nOt (color: green) {
                div { background: red; }
            }
        </style>
        <div/>
    </rendering>

    <rendering>
        <style>
            @supports (color: green) and (color: red) {
                div { background: green; }
            }
        </style>
        <div/>
    </rendering>

    <rendering>
        <style>
            @supports (color: green) AnD (color: red) {
            div { background: green; }
            }
        </style>
        <div/>
    </rendering>

    <rendering>
        <style>
            @supports (color: green) or (color: red) {
            div { background: green; }
            }
        </style>
        <div/>
    </rendering>

    <rendering>
        <style>
            @supports (color: green) Or (color: red) {
            div { background: green; }
            }
        </style>
        <div/>
    </rendering>
</test>

<!-- https://drafts.csswg.org/css-conditional-3/#support-definition -->
<!-- https://drafts.csswg.org/css-values-5/#arbitrary-substitution -->
<test name="@supports declaration: not supported">
    <container>
        <html xmlns="http://www.w3.org/1999/xhtml">
        <head>
            <style>
                div { width: 100px; height: 100px; background: green }
            </style>
        </head>
        <body>
        <slot/>
        </body>
        </html>
    </container>

    <rendering>
        <div/>
    </rendering>

    <rendering>
        <style>
            @supports (skibidi-property: var(--six-seven)) {
                div { background: red; }
            }
        </style>
        <div/>
    </rendering>
</test>

<!-- https://drafts.csswg.org/css-values-5/#component-function-commas -->
<!-- https://drafts.csswg.org/css-variables-2/#typedef-var-args -->
<!-- https://drafts.csswg.org/css-syntax-3/#consume-declaration -->
<test name="@supports declaration edge cases: supported">
    <container>
        <html xmlns="http://www.w3.org/1999/xhtml">
        <head>
            <style>
                div { width: 100px; height: 100px }
            </style>
        </head>
        <body>
        <slot/>
        </body>
        </html>
    </container>

    <rendering>
        <style>
            div {background: green}
        </style>
        <div/>
    </rendering>

    <rendering>
        <style>
            @supports (color: var({--x})) { div { background: green } }
        </style>
        <div/>
    </rendering>

    <rendering>
        <style>
            @supports (color: var(--x, {red})) { div { background: green } }
        </style>
        <div/>
    </rendering>

    <rendering>
        <style>
            @supports (--x: {red}) { div { background: green } }
        </style>
        <div/>
    </rendering>
</test>

<test name="@supports declaration edge cases: not supported">
    <container>
        <html xmlns="http://www.w3.org/1999/xhtml">
        <head>
            <style>
                div { width: 100px; height: 100px; background: red }
            </style>
        </head>
        <body>
        <slot/>
        </body>
        </html>
    </container>

    <rendering>
        <style>
            div {background: green}
        </style>
        <div/>
    </rendering>

    <!-- https://drafts.csswg.org/css-variables-2/#typedef-var-args -->
    <!-- https://drafts.csswg.org/css-syntax-3/#typedef-declaration-value -->
    <error>
        <style>
            @supports (color: var()) { div { background: green } }
        </style>
        <div/>
    </error>

    <!-- https://drafts.csswg.org/css-values-5/#component-function-commas -->
    <error>
        <style>
            @supports (color: var({--x}b)) { div { background: green } }
        </style>
        <div/>
    </error>

    <!-- https://drafts.csswg.org/css-values-5/#component-function-commas -->
    <!-- https://drafts.csswg.org/css-syntax-3/#typedef-declaration-value -->
    <error>
        <style>
            @supports (color: var({})) { div { background: green } }
        </style>
        <div/>
    </error>

    <!-- https://drafts.csswg.org/css-syntax-3/#consume-declaration -->
    <error>
        <style>
            @supports (color: {a} b) { div { background: green } }
        </style>
        <div/>
    </error>

    <!-- https://drafts.csswg.org/css-syntax-3/#typedef-declaration-value -->
    <error>
        <style>
            @supports (--x: ]) { div { background: green } }
        </style>
        <div/>
    </error>

    <!-- https://drafts.csswg.org/css-syntax-3/#consume-string-token -->
    <!-- https://drafts.csswg.org/css-syntax-3/#typedef-any-value -->
    <!-- https://drafts.csswg.org/mediaqueries-4/#typedef-general-enclosed -->
    <error>
        <style>
            @supports (--x: "a
            ) { div { background: green } }
        </style>
        <div/>
    </error>

    <error>
        <style>
            @supports (foo "a
            ) { div { background: green } }
        </style>
        <div/>
    </error>

</test>

<!-- https://drafts.csswg.org/css-conditional-3/#processing -->
<!-- https://drafts.csswg.org/css-conditional-3/#contents-of -->
<test name="@supports: nested @font-face is loaded">
    <container>
        <html xmlns="http://www.w3.org/1999/xhtml">
        <head>
            <style>
                p { font-family: "Test", serif; font-size: 20px; margin: 0; }
            </style>
        </head>
        <body>
        <slot/>
        </body>
        </html>
    </container>

    <rendering>
        <style>@font-face { font-family: "Test"; src: url(bundle://fonts.anton/public/fonts/Anton-Regular.ttf); } </style>
        <p>XxXxX</p>
    </rendering>

    <rendering>
        <style>@supports (color: green) { @font-face {font-family: "Test"; src: url(bundle://fonts.anton/public/fonts/Anton-Regular.ttf); } } </style>
        <p>XxXxX</p>
    </rendering>

    <error>
        <style>@supports (color: skibidi-blue) { @font-face {font-family: "Test"; src: url(bundle://fonts.anton/public/fonts/Anton-Regular.ttf); } } </style>
        <p>XxXxX</p>
    </error>
</test>

</tests>
